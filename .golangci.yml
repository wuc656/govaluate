version: "2"
linters:
  enable:
    - gosec
    - misspell
  disable:
    - dupl
    - goconst
    - gocyclo
    - lll
    - mnd
    - prealloc
    - revive
    - unparam
    - wsl
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - dupl
          - goconst
          - gocyclo
          - gosec
        path: _test\.go
      - linters:
          - dupl
          - goconst
          - gocyclo
          - gosec
        path: benchmarks_test\.go
      - linters:
          - dupl
          - goconst
          - gocyclo
          - gosec
        path: torture_test\.go
    paths:
      - third_party$
      - builtin$
      - examples$
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
formatters:
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
