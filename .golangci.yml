# golangci-lint configuration file
# See https://golangci-lint.run/usage/configuration/

run:
  timeout: 10m

linters:
  enable:
    - govet
    - staticcheck
    - unused
    - ineffassign
    - errcheck
    - gosec
    - misspell

  disable:
    - lll
    - wsl
    - gomnd
    - gocyclo
    - goconst
    - dupl
    - unparam
    - revive
    - prealloc

linters-settings:
  staticcheck:
    # 'go' version is inferred from go.mod, no longer allowed here

  gosec:
    exclude:
      - G404  # Disable weak random number generator check for test files

issues:
  exclude-rules:
    - path: _test\.go
      linters:
        - gocyclo
        - dupl
        - goconst
        - gosec
    - path: benchmarks_test\.go
      linters:
        - gocyclo
        - dupl
        - goconst
        - gosec
    - path: torture_test\.go
      linters:
        - gocyclo
        - dupl
        - goconst
        - gosec

  max-issues-per-linter: 0
  max-same-issues: 0