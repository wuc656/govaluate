# golangci-lint configuration file
# See https://golangci-lint.run/usage/configuration/

run:
  timeout: 10m

linters:
  enable:
    - govet
    - staticcheck
    - unused
    - ineffassign
    - errcheck
    - gosec
    - misspell

  disable:
    - lll
    - wsl
    - gomnd
    - gocyclo
    - goconst
    - dupl
    - unparam
    - revive
    - prealloc

issues:
  exclude-rules:
    - path: _test\.go
      linters:
        - gocyclo
        - dupl
        - goconst
        - gosec
    - path: benchmarks_test\.go
      linters:
        - gocyclo
        - dupl
        - goconst
        - gosec
    - path: torture_test\.go
      linters:
        - gocyclo
        - dupl
        - goconst
        - gosec

  max-issues-per-linter: 0
  max-same-issues: 0